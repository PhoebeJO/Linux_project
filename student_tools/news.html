<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>📰 新聞播報</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Segoe UI', Arial, sans-serif;
            background: linear-gradient(135deg, #1a1a2e 0%, #16213e 100%);
            color: #fff; min-height: 100vh; padding: 30px;
        }
        .container { max-width: 900px; margin: 0 auto; }
        .nav-links { margin-bottom: 20px; opacity: 0.7; }
        .nav-links a { color: #4fc3f7; text-decoration: none; margin-right: 20px; }
        .nav-links a:hover { text-decoration: underline; }
        h1 { font-size: 2em; margin-bottom: 5px; }
        .subtitle { opacity: 0.5; margin-bottom: 25px; font-size: 0.9em; }

        .news-list { display: flex; flex-direction: column; gap: 15px; }
        .news-card {
            background: rgba(255,255,255,0.06);
            border-radius: 14px; padding: 20px 25px;
            border-left: 4px solid #4fc3f7;
            transition: all 0.3s; cursor: pointer;
        }
        .news-card:hover { background: rgba(255,255,255,0.12); transform: translateX(5px); }
        .news-title { font-size: 1.15em; font-weight: bold; margin-bottom: 6px; line-height: 1.4; }
        .news-meta { font-size: 0.82em; opacity: 0.5; margin-bottom: 8px; }
        .news-summary { font-size: 0.92em; opacity: 0.75; line-height: 1.6; }
        .news-source {
            display: inline-block; padding: 2px 10px;
            background: rgba(79,195,247,0.15); color: #4fc3f7;
            border-radius: 20px; font-size: 0.78em; margin-right: 8px;
        }

        .topic-form {
            background: rgba(255,255,255,0.07);
            border-radius: 16px; padding: 22px 25px;
            margin-bottom: 20px;
        }
        .topic-form h2 { font-size: 1.15em; margin-bottom: 12px; }
        .topic-row {
            display: flex; gap: 10px; align-items: center; flex-wrap: wrap;
        }
        .topic-row input {
            flex: 1; min-width: 200px; padding: 10px 14px;
            border: 1px solid rgba(255,255,255,0.15); border-radius: 10px;
            background: rgba(255,255,255,0.08); color: #fff;
            font-size: 1em; outline: none;
        }
        .topic-row input:focus { border-color: #4fc3f7; }
        .topic-tags { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 12px; }
        .topic-tag {
            padding: 6px 14px; border-radius: 20px; font-size: 0.82em;
            background: rgba(255,255,255,0.08); color: #ccc;
            border: 1px solid rgba(255,255,255,0.12);
            cursor: pointer; transition: all 0.2s;
        }
        .topic-tag:hover { background: rgba(79,195,247,0.2); color: #4fc3f7; border-color: #4fc3f7; }
        .topic-hint { font-size: 0.8em; opacity: 0.45; margin-top: 10px; }
        .current-topic {
            display: inline-block; padding: 3px 12px;
            background: rgba(79,195,247,0.15); color: #4fc3f7;
            border-radius: 20px; font-size: 0.85em; font-weight: bold;
        }

        .actions {
            display: flex; gap: 12px; margin-bottom: 25px;
        }
        .btn {
            padding: 10px 24px; border: none; border-radius: 10px;
            cursor: pointer; font-size: 0.95em; font-weight: bold;
            transition: all 0.3s;
        }
        .btn:hover { transform: scale(1.03); }
        .btn-refresh { background: rgba(255,255,255,0.1); color: #fff; }
        .btn-telegram { background: #0088cc; color: #fff; }
        .btn-topic { background: #4fc3f7; color: #1a1a2e; }

        .empty-msg { text-align: center; padding: 60px; opacity: 0.4; font-size: 1.1em; }

        .toast {
            position: fixed; bottom: 30px; right: 30px;
            padding: 14px 24px; border-radius: 12px; font-weight: bold;
            transform: translateY(100px); opacity: 0;
            transition: all 0.4s; z-index: 999;
        }
        .toast.show { transform: translateY(0); opacity: 1; }
        .toast.success { background: #2ecc71; }
        .toast.error { background: #e74c3c; }
    </style>
</head>
<body>
<div class="container">
    <div class="nav-links">
        <a href="/">🍅 番茄鐘</a>
        <a href="/admin">📚 作業管理</a>
        <a href="/stocks">📈 股價</a>
        <a href="/weather">☀️ 天氣</a>
        <a href="/news">📰 新聞</a>
    </div>
    <h1>📰 新聞播報</h1>
    <p class="subtitle" id="updateTime">自訂主題，自動抓取最新新聞</p>

    <!-- 主題設定 -->
    <div class="topic-form">
        <h2>🔍 搜尋主題　<span class="current-topic" id="currentTopic">載入中...</span></h2>
        <div class="topic-row">
            <input type="text" id="topicInput" placeholder="輸入你想追蹤的新聞主題，例如：台積電 法說會">
            <button class="btn btn-topic" onclick="saveTopic()">🔎 搜尋</button>
        </div>
        <div class="topic-tags">
            <span class="topic-tag" onclick="quickTopic('AI 人工智慧')">AI 人工智慧</span>
            <span class="topic-tag" onclick="quickTopic('台積電')">台積電</span>
            <span class="topic-tag" onclick="quickTopic('Bitcoin 比特幣')">比特幣</span>
            <span class="topic-tag" onclick="quickTopic('半導體')">半導體</span>
            <span class="topic-tag" onclick="quickTopic('Tesla')">Tesla</span>
            <span class="topic-tag" onclick="quickTopic('台股')">台股</span>
            <span class="topic-tag" onclick="quickTopic('Netflix')">Netflix</span>
            <span class="topic-tag" onclick="quickTopic('資安 cybersecurity')">資安</span>
        </div>
        <p class="topic-hint">💡 主題範圍越小，搜尋到的新聞越精準。例如「AI」會很廣泛，「GPT-5 發布」就會更明確</p>
    </div>

    <div class="actions">
        <button class="btn btn-refresh" onclick="loadNews()">🔄 重新整理</button>
        <button class="btn btn-telegram" onclick="pushTelegram()">📱 推送到 Telegram</button>
    </div>

    <div class="news-list" id="newsList">
        <div class="empty-msg">⏳ 載入新聞中...</div>
    </div>
</div>
<div class="toast" id="toast"></div>
<script>
    let newsData = [];

    async function loadNews() {
        try {
            const resp = await fetch('/api/news');
            const data = await resp.json();
            newsData = data.articles || [];
            const list = document.getElementById('newsList');

            if (data.query) {
                document.getElementById('currentTopic').textContent = data.query;
            }

            if (newsData.length === 0) {
                list.innerHTML = '<div class="empty-msg">暫無新聞，稍後重試</div>';
                return;
            }

            list.innerHTML = newsData.map(a => `
                <div class="news-card" onclick="window.open('${a.link}','_blank')">
                    <div class="news-title">${escHtml(a.title)}</div>
                    <div class="news-meta">
                        <span class="news-source">${escHtml(a.source)}</span>
                        ${a.published || ''}
                    </div>
                    <div class="news-summary">${escHtml(a.summary || '')}</div>
                </div>
            `).join('');

            document.getElementById('updateTime').textContent =
                `主題：${data.query || '--'} ｜ 更新：${data.updated_at || '--'} ｜ 每 2 小時自動抓取`;
        } catch (e) {
            document.getElementById('newsList').innerHTML =
                '<div class="empty-msg">載入失敗：' + e.message + '</div>';
        }
    }

    async function loadConfig() {
        try {
            const resp = await fetch('/api/news/config');
            const cfg = await resp.json();
            document.getElementById('topicInput').value = cfg.query || '';
            document.getElementById('currentTopic').textContent = cfg.query || 'AI 人工智慧';
        } catch (e) {}
    }

    async function saveTopic() {
        const query = document.getElementById('topicInput').value.trim();
        if (!query) { showToast('請輸入搜尋主題', 'error'); return; }
        try {
            const resp = await fetch('/api/news/config', {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({query})
            });
            const r = await resp.json();
            if (r.ok) {
                showToast('✅ 主題已更新，正在抓取新聞...', 'success');
                document.getElementById('currentTopic').textContent = query;
                document.getElementById('newsList').innerHTML =
                    '<div class="empty-msg">⏳ 正在抓取「' + escHtml(query) + '」相關新聞...</div>';
                setTimeout(loadNews, 5000);
            } else {
                showToast('設定失敗：' + (r.error || ''), 'error');
            }
        } catch (e) { showToast('設定失敗', 'error'); }
    }

    function quickTopic(topic) {
        document.getElementById('topicInput').value = topic;
        saveTopic();
    }

    async function pushTelegram() {
        try {
            const resp = await fetch('/api/news/push', { method: 'POST' });
            const r = await resp.json();
            if (r.ok) showToast('✅ 已推送到 Telegram！', 'success');
            else showToast('推送失敗', 'error');
        } catch (e) { showToast('推送失敗', 'error'); }
    }

    function showToast(msg, type) {
        const t = document.getElementById('toast');
        t.textContent = msg;
        t.className = `toast ${type} show`;
        setTimeout(() => t.className = 'toast', 3000);
    }

    function escHtml(s) {
        if (!s) return '';
        const d = document.createElement('div');
        d.textContent = s;
        return d.innerHTML;
    }

    loadConfig();
    loadNews();
    setInterval(loadNews, 600000);
</script>
</body>
</html>
