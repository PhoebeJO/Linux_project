groups:
  - name: student_alerts
    rules:

      # ── 作業快到期（24 小時內）──
      - alert: HomeworkDeadlineSoon
        expr: homework_deadline_hours_remaining < 24 and homework_deadline_hours_remaining > 0
        for: 1m
        labels:
          severity: warning
          category: student
        annotations:
          summary: "📚 作業快到期了！"
          description: "「{{ $labels.task }}」（{{ $labels.course }}）剩餘 {{ $value | printf \"%.1f\" }} 小時，記得完成！"

      # ── 作業非常緊急（3 小時內）──
      - alert: HomeworkDeadlineUrgent
        expr: homework_deadline_hours_remaining < 3 and homework_deadline_hours_remaining > 0
        for: 0m
        labels:
          severity: critical
          category: student
        annotations:
          summary: "🚨 作業即將到期！"
          description: "「{{ $labels.task }}」只剩 {{ $value | printf \"%.1f\" }} 小時！快去寫！"

      # ── 深夜使用提醒（根據網頁設定的時間）──
      - alert: LateNightUsage
        expr: late_night_active == 1
        for: 1m
        labels:
          severity: info
          category: student
        annotations:
          summary: "🌙 深夜了！記得休息"
          description: "現在已超過設定的深夜時段，建議停止使用電腦，保持良好作息！明天繼續加油 💪"
